<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A one-page wedding invitation for Ryan and Jessica with weekend details, registry notes, and RSVP information."
    />
    <meta name="theme-color" content="#5a5246" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Ryan and Jessica | Wedding Invitation</title>
  </head>
  <body>
    <div id="app"></div>
    <form name="rsvp" method="POST" data-netlify="true" hidden aria-hidden="true">
      <input type="hidden" name="form-name" value="rsvp" />
      <input type="text" name="guestName" />
      <input type="email" name="email" />
      <input type="text" name="songRequest" />
      <select name="attendance">
        <option value="joyfullyAccepts">Joyfully accepts</option>
        <option value="regretfullyDeclines">Regretfully declines</option>
      </select>
      <textarea name="notes"></textarea>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
